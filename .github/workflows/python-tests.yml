name: Python tests

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

jobs:
  test:
    runs-on: ubuntu-20.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3-pyqt5 \
            python3-xlib \
            libxfixes-dev \
            libxrandr \
            xrandr \
            xvfb

      - name: Unit tests (no display required)
        run: python3 -m unittest discover -t . -s tests -p "test_*.py" -v

      - name: Smoke test (Xvfb)
        run: |
          stderr_log="$(mktemp)"
          trap 'rm -f "$stderr_log"' EXIT
          xvfb-run -a python3 -m unittest discover -t . -s tests -p "smoke_test.py" -v 2>"$stderr_log"
          cat "$stderr_log"
          if grep -Eq 'QPainter::|QBackingStore::endPaint\(\) called with active painter|QPaintDevice: Cannot destroy paint device that is being painted' "$stderr_log"; then
            echo 'Qt paint-lifecycle diagnostic detected' >&2
            exit 1
          fi
